    html, body {

    /* Main Floating Header Title */
    #main-title {

      left: 0;
      right: 0;
      width: 100%;

      z-index: 20;
      pointer-events: none;
      text-align: center;
      line-height: 1.2;
      padding: 0 15px;
      transition: all 0.5s ease;

    /* Start Overlay Screen */
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #0a0618 0%, #000000 100%);

      justify-content: center;
      align-items: center;

      color: #fff;
      z-index: 9999;
      padding: 20px;
      cursor: pointer;

    #start-screen.hidden {

      visibility: hidden;
      pointer-events: none;
    }

    #start-heart {
      font-size: clamp(80px, 22vmin, 150px);
      line-height: 1;

      transform-origin: 50% 55%;

    @keyframes heartPulse {
      0%, 100% { transform: scale(1); }
      12% { transform: scale(1.15); }
      24% { transform: scale(1); }
      36% { transform: scale(1.08); }
      50% { transform: scale(1); }

    #start-text {

    @keyframes textBlink {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    /* Glassmorphism Control Panel Drawer */
    .glass-panel {
      background: rgba(12, 8, 28, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 215, 0, 0.25);

    }

    /* Equalizer animation for music */
    .eq-bar {
      width: 3px;
      background-color: #facc15;
      border-radius: 3px;
      animation: eqPulse 0.8s ease-in-out infinite alternate;
    }
    .eq-bar:nth-child(1) { animation-delay: 0.0s; height: 12px; }
    .eq-bar:nth-child(2) { animation-delay: 0.2s; height: 16px; }
    .eq-bar:nth-child(3) { animation-delay: 0.4s; height: 8px; }
    .eq-bar:nth-child(4) { animation-delay: 0.1s; height: 14px; }

    @keyframes eqPulse {
      0% { transform: scaleY(0.3); }
      100% { transform: scaleY(1.1); }
    }

<!-- Lógica en JavaScript -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const audio = document.getElementById('audio');
    const musicBtn = document.getElementById('music-btn');
    const musicIcon = document.getElementById('music-icon');
    const eqVisualizer = document.getElementById('eq-visualizer');
    const startScreen = document.getElementById('start-screen');

    // Cambia la interfaz a estado de reproducción
    function setUIPlaying() {
      if (musicIcon) musicIcon.className = "fas fa-volume-high text-amber-400";
      if (eqVisualizer) eqVisualizer.classList.remove('hidden');
    }

    // Cambia la interfaz a estado de pausa
    function setUIPaused() {
      if (musicIcon) musicIcon.className = "fas fa-music text-amber-400";
      if (eqVisualizer) eqVisualizer.classList.add('hidden');
    }

    // Reproduce el audio asegurando la interacción inicial
    function playAudio() {
      audio.play().then(() => {
        setUIPlaying();
      }).catch(err => {
        console.warn("El navegador solicitó interacción del usuario:", err);
      });
    }

    // 1. Iniciar música al tocar la pantalla de inicio
    if (startScreen) {
      startScreen.addEventListener('click', () => {
        playAudio();
      });
    }

    // 2. Controlar Pausa / Reproducción desde el botón superior
    if (musicBtn) {
      musicBtn.addEventListener('click', (e) => {
        e.stopPropagation(); // Evita interferencias con otros clics
        if (audio.paused) {
          playAudio();
        } else {
          audio.pause();
          setUIPaused();
        }
      });
    }
  });
</script>

document.addEventListener('DOMContentLoaded', () => {

    function playLullabyMelody() {
      if (!isAudioPlaying || !audioCtx) return;

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      // Soft Relaxing Lullaby Pentatonic Sequence
      const notes = [
        261.63, 329.63, 392.00, 523.25, 659.25, 783.99,
        392.00, 329.63, 440.00, 523.25, 659.25, 880.00
      ];

      const note = notes[Math.floor(Math.random() * notes.length)];
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(note, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.8);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 2.9);

      audioLoopTimer = setTimeout(playLullabyMelody, Math.random() * 800 + 600);
    }

    function toggleAudio() {
      initWebAudio();
      const musicIcon = document.getElementById('music-icon');
      const eqVisualizer = document.getElementById('eq-visualizer');

      if (!isAudioPlaying) {
        isAudioPlaying = true;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        playLullabyMelody();
        musicIcon.className = "fas fa-volume-high text-amber-400";
        eqVisualizer.classList.remove('hidden');
      } else {
        isAudioPlaying = false;
        if (audioLoopTimer) clearTimeout(audioLoopTimer);
        musicIcon.className = "fas fa-music text-amber-400";
        eqVisualizer.classList.add('hidden');
      }
    }

    document.getElementById('music-btn').addEventListener('click', toggleAudio);

    // Three.js Scene Setup
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020108);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
    let targetDist = 320, currentDist = 320, rotX = 0.2, rotY = 0;

    // Starfield Generation
    (function createStarfield(count = 2500, spread = 3200) {
      const g = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const r = spread * (0.2 + Math.random() * 0.8);
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        pos[i * 3 + 0] = r * Math.sin(ph) * Math.cos(th);
        pos[i * 3 + 1] = r * Math.cos(ph);
        pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
      }
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 1.5, color: 0xffffff, transparent: true, opacity: 0.9 })));
    })();

    // Black Hole Core
    const coreMat = new THREE.MeshBasicMaterial({ color: 0x010103 });
    const core = new THREE.Mesh(new THREE.SphereGeometry(42, 64, 64), coreMat);
    scene.add(core);

    // Outer Glow Sprite Texture Generator
    const GLOW_BASE = 380;
    function makeGlowTexture(theme = 'gold') {
      const size = 512;
      const c = document.createElement('canvas'); c.width = c.height = size;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(size / 2, size / 2, size * 0.05, size / 2, size / 2, size * 0.5);
      
      let c1 = '255,235,130', c2 = '255,180,0';
      if (theme === 'pink') { c1 = '244,114,182'; c2 = '192,38,211'; }
      else if (theme === 'emerald') { c1 = '52,211,153'; c2 = '16,185,129'; }
      else if (theme === 'blue') { c1 = '56,189,248'; c2 = '59,130,246'; }

      grad.addColorStop(0, `rgba(${c1},0.65)`);
      grad.addColorStop(0.5, `rgba(${c2},0.25)`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad; g.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(c);
    }

    let glowMat = new THREE.SpriteMaterial({ map: makeGlowTexture(CURRENT_CONFIG.theme), transparent: true, depthWrite: false });
    const glow = new THREE.Sprite(glowMat);
    glow.scale.set(GLOW_BASE, GLOW_BASE, 1);
    scene.add(glow);

    // Accretion Ring Texture Generator
    function makeRingTexture(theme = 'gold') {
      const size = 1024;
      const c = document.createElement('canvas'); c.width = c.height = size;
      const g = c.getContext('2d'); g.translate(size / 2, size / 2);
      const rInner = size * 0.205, rOuter = size * 0.49;

      let stops = [
        [0.00, 'rgba(255,255,245,1)'],
        [0.30, 'rgba(255,235,120,1)'],
        [0.65, 'rgba(255,200,40,0.95)'],
        [1.00, 'rgba(255,160,0,0.85)']
      ];

      if (theme === 'pink') {
        stops = [
          [0.00, 'rgba(255,240,255,1)'],
          [0.30, 'rgba(244,114,182,1)'],
          [0.65, 'rgba(192,38,211,0.95)'],
          [1.00, 'rgba(126,34,206,0.85)']
        ];
      } else if (theme === 'emerald') {
        stops = [
          [0.00, 'rgba(240,253,244,1)'],
          [0.30, 'rgba(52,211,153,1)'],
          [0.65, 'rgba(16,185,129,0.95)'],
          [1.00, 'rgba(5,150,105,0.85)']
        ];
      } else if (theme === 'blue') {
        stops = [
          [0.00, 'rgba(238,242,255,1)'],
          [0.30, 'rgba(56,189,248,1)'],
          [0.65, 'rgba(59,130,246,0.95)'],
          [1.00, 'rgba(29,78,216,0.85)']
        ];
      }

      const grd = g.createRadialGradient(0, 0, rInner, 0, 0, rOuter);
      stops.forEach(s => grd.addColorStop(s[0], s[1]));

      g.fillStyle = grd;
      g.beginPath(); g.arc(0, 0, rOuter, 0, Math.PI * 2); g.arc(0, 0, rInner, 0, Math.PI * 2, true); g.closePath(); g.fill();

      // Fine concentric ring lines
      const bandCount = 28;
      for (let i = 0; i < bandCount; i++) {
        const r = rInner + (rOuter - rInner) * (i / (bandCount - 1));
        const dark = i % 3 === 0;
        g.beginPath();
        g.arc(0, 0, r, 0, Math.PI * 2);
        g.lineWidth = (rOuter - rInner) / bandCount * (0.55 + Math.random() * 0.35);
        g.strokeStyle = dark ? 'rgba(0,0,0,0.22)' : 'rgba(255,255,255,0.18)';
        g.stroke();
      }
      return new THREE.CanvasTexture(c);
    }

    const ringMat = new THREE.MeshBasicMaterial({
      map: makeRingTexture('gold'),
      transparent: true,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      opacity: 0.95
    });
    const ring = new THREE.Mesh(new THREE.RingGeometry(42, 118, 160), ringMat);
    ring.rotation.x = Math.PI / 2;
    scene.add(ring);

    // Floating Words Sprite Group
    const textGroup = new THREE.Group();
    scene.add(textGroup);

    function createPhraseSprite(text, color) {
      const c = document.createElement('canvas'); c.width = 512; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff'; ctx.shadowColor = color; ctx.shadowBlur = 24;

      const maxWidth = c.width - 48;
      let fontSize = 54;
      ctx.font = fontSize + "px 'Indie Flower', cursive";
      while (ctx.measureText(text).width > maxWidth && fontSize > 22) {
        fontSize -= 2;
        ctx.font = fontSize + "px 'Indie Flower', cursive";
      }
      ctx.fillText(text, c.width / 2, c.height / 2);

      const tex = new THREE.CanvasTexture(c);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sp = new THREE.Sprite(mat);
      sp.scale.set(68, 21.8, 1);
      return sp;
    }

    const COLORS_PALETTE = ['#ffd700', '#ffe066', '#ffcc33', '#ffb347', '#fff2b0', '#ffaa00', '#f4c430', '#ffdb58'];

    function rebuildTextGroup() {
      while (textGroup.children.length > 0) {
        const child = textGroup.children[0];
        textGroup.remove(child);
      }

      const frases = CURRENT_CONFIG.frases.length > 0 ? CURRENT_CONFIG.frases : DEFAULT_CONFIG.frases;
      const WORD_SLOTS = 140;

      for (let i = 0; i < WORD_SLOTS; i++) {
        const text = frases[i % frases.length];
        const sp = createPhraseSprite(text, COLORS_PALETTE[i % COLORS_PALETTE.length]);
        
        const phi = Math.acos(2 * Math.random() - 1);
        const theta = Math.random() * Math.PI * 2;
        const r = 150 + Math.random() * 130;

        sp.position.set(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
        sp.userData = { phi, theta, radius: r, speed: 0.0008 + Math.random() * 0.0012 };
        textGroup.add(sp);
      }
    }

    // Floating Photo Sprites Group
    const photoGroup = new THREE.Group();
    scene.add(photoGroup);

    function createPhotoSprite(url, size = 32) {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const tex = new THREE.CanvasTexture(c);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sp = new THREE.Sprite(mat);
      sp.scale.set(size, size, 1);

      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, c.width, c.height);

        // Circular cropped frame with glowing yellow border
        ctx.save();
        ctx.beginPath();
        ctx.arc(128, 128, 120, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();

        const s = Math.max(256 / img.width, 256 / img.height);
        ctx.drawImage(img, (256 - img.width * s) / 2, (256 - img.height * s) / 2, img.width * s, img.height * s);
        ctx.restore();

        // Golden Ring Frame
        ctx.beginPath();
        ctx.arc(128, 128, 120, 0, Math.PI * 2);
        ctx.lineWidth = 10;
        ctx.strokeStyle = '#facc15';
        ctx.stroke();

        tex.needsUpdate = true;
      };
      img.src = url;
      return sp;
    }

    function rebuildPhotoGroup() {
      while (photoGroup.children.length > 0) {
        photoGroup.remove(photoGroup.children[0]);
      }

      const fotos = CURRENT_CONFIG.fotos.length > 0 ? CURRENT_CONFIG.fotos : DEFAULT_CONFIG.fotos;
      const PHOTO_COUNT = 24;

      for (let i = 0; i < PHOTO_COUNT; i++) {
        const url = fotos[i % fotos.length];
        const size = 30 + Math.random() * 18;
        const sp = createPhotoSprite(url, size);

        const phi = Math.acos(2 * Math.random() - 1);
        const theta = Math.random() * Math.PI * 2;
        const r = 145 + Math.random() * 160;

        sp.position.set(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
        sp.userData = { phi, theta, radius: r, speed: 0.0006 + Math.random() * 0.0012 };
        photoGroup.add(sp);
      }
    }

    // Dynamic Petal / Burst Particles Group
    const burstGroup = new THREE.Group();
    scene.add(burstGroup);

    function triggerFlowerBurst() {
      for (let i = 0; i < 80; i++) {
        const c = document.createElement('canvas'); c.width = c.height = 64;
        const ctx = c.getContext('2d');
        ctx.font = '48px serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(Math.random() > 0.4 ? '🌻' : '🌼', 32, 32);

        const tex = new THREE.CanvasTexture(c);
        const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
        const sp = new THREE.Sprite(mat);
        sp.scale.set(16, 16, 1);

        sp.position.set(0, 0, 0);
        const speed = 2 + Math.random() * 4;
        const angle = Math.random() * Math.PI * 2;
        const vZ = (Math.random() - 0.5) * 4;

        sp.userData = {
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          vz: vZ,
          life: 1.0,
          decay: 0.008 + Math.random() * 0.008
        };

        burstGroup.add(sp);
      }
    }

    document.getElementById('burst-btn').addEventListener('click', triggerFlowerBurst);

    // Camera Navigation & Drag Mechanics
    let dragging = false, lastX = 0, lastY = 0;

    function onDown(e) {
      dragging = true;
      const t = e.touches ? e.touches[0] : e;
      lastX = t.clientX; lastY = t.clientY;
    }

    function onMove(e) {
      if (!dragging) return;
      const t = e.touches ? e.touches[0] : e;
      const dx = (t.clientX - lastX) / window.innerWidth;
      const dy = (t.clientY - lastY) / window.innerHeight;
      rotY -= dx * 5;
      rotX = Math.max(-1.2, Math.min(1.2, rotX + dy * 3.5));
      lastX = t.clientX; lastY = t.clientY;
    }

    function onUp() { dragging = false; }

    window.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchstart', onDown, { passive: true });
    window.addEventListener('touchmove', onMove, { passive: true });
    window.addEventListener('touchend', onUp, { passive: true });

    window.addEventListener('wheel', (e) => {
      targetDist += e.deltaY * 0.25;
      targetDist = Math.max(150, Math.min(650, targetDist));
    }, { passive: true });

    // Window Resize Handler
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    let clockTime = 0;
    function animate() {
      requestAnimationFrame(animate);
      clockTime += 0.01;

      ring.rotation.z += 0.0025;
      glow.scale.set(GLOW_BASE * (1 + Math.sin(clockTime * 0.4) * 0.03), GLOW_BASE * (1 + Math.sin(clockTime * 0.4) * 0.03), 1);

      // Pulse Core
      const s = 1.0 + 0.04 * Math.sin(clockTime * 3);
      core.scale.set(s, s, s);

      // Animate Floating Words
      textGroup.children.forEach(sp => {
        sp.material.opacity = 0.8 + 0.2 * Math.sin(clockTime * 2);
        sp.userData.theta += sp.userData.speed;
        sp.position.x = sp.userData.radius * Math.sin(sp.userData.phi) * Math.cos(sp.userData.theta);
        sp.position.z = sp.userData.radius * Math.sin(sp.userData.phi) * Math.sin(sp.userData.theta);
      });

      // Animate Orbiting Photos
      photoGroup.children.forEach(sp => {
        sp.material.opacity = 0.85 + 0.15 * Math.sin(clockTime * 2 + sp.userData.radius);
        sp.userData.theta += sp.userData.speed;
        sp.position.x = sp.userData.radius * Math.sin(sp.userData.phi) * Math.cos(sp.userData.theta);
        sp.position.z = sp.userData.radius * Math.sin(sp.userData.phi) * Math.sin(sp.userData.theta);
      });

      // Animate Petal Bursts
      for (let i = burstGroup.children.length - 1; i >= 0; i--) {
        const sp = burstGroup.children[i];
        sp.position.x += sp.userData.vx;
        sp.position.y += sp.userData.vy;
        sp.position.z += sp.userData.vz;
        sp.userData.life -= sp.userData.decay;
        sp.material.opacity = sp.userData.life;

        if (sp.userData.life <= 0) {
          burstGroup.remove(sp);
        }
      }

      // Smooth Camera Interpolation
      currentDist += (targetDist - currentDist) * 0.06;
      const cx = Math.cos(rotX), sx = Math.sin(rotX);
      const cy = Math.cos(rotY), sy = Math.sin(rotY);
      camera.position.set(currentDist * sy * cx, currentDist * sx, currentDist * cy * cx);
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }

    // Start Screen Launch Mechanics
    const startScreen = document.getElementById('start-screen');
    function startGalaxyExperience() {
      startScreen.classList.add('hidden');
      if (!isAudioPlaying) {
        toggleAudio();
      }
      triggerFlowerBurst();
    }
    startScreen.addEventListener('click', startGalaxyExperience);

    // Customizer Drawer Functionality
    const drawer = document.getElementById('custom-drawer');
    const drawerContent = document.getElementById('drawer-content');
    const inputTitle = document.getElementById('input-title');
    const inputPhrases = document.getElementById('input-phrases');
    const inputPhotoFile = document.getElementById('input-photo-file');
    const photoPreviewGrid = document.getElementById('photo-preview-grid');

    document.getElementById('drawer-toggle-btn').addEventListener('click', () => {
      // Sync form values
      inputTitle.value = CURRENT_CONFIG.titulo;
      inputPhrases.value = CURRENT_CONFIG.frases.join('\n');
      updatePhotoPreviews();

      drawer.classList.remove('pointer-events-none', 'opacity-0');
      drawerContent.classList.remove('translate-x-full');
    });

    document.getElementById('close-drawer-btn').addEventListener('click', closeCustomizerDrawer);

    function closeCustomizerDrawer() {
      drawerContent.classList.add('translate-x-full');
      drawer.classList.add('opacity-0');
      setTimeout(() => drawer.classList.add('pointer-events-none'), 300);
    }

    // Photo File Upload Handler
    inputPhotoFile.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (evt) => {
          CURRENT_CONFIG.fotos.push(evt.target.result);
          updatePhotoPreviews();
        };
        reader.readAsDataURL(file);
      });
    });

    function updatePhotoPreviews() {
      photoPreviewGrid.innerHTML = '';
      document.getElementById('photo-count-label').innerText = `${CURRENT_CONFIG.fotos.length} Fotos Cargadas`;

      CURRENT_CONFIG.fotos.forEach((url, index) => {
        const container = document.createElement('div');
        container.className = "relative flex-shrink-0 w-16 h-16 rounded-xl overflow-hidden border border-amber-400/50 group";
        
        const img = document.createElement('img');
        img.src = url;
        img.className = "w-full h-full object-cover";

        const delBtn = document.createElement('button');
        delBtn.type = "button";
        delBtn.className = "absolute inset-0 bg-black/60 text-red-400 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity";
        delBtn.innerHTML = '<i class="fas fa-trash"></i>';
        delBtn.onclick = () => {
          CURRENT_CONFIG.fotos.splice(index, 1);
          updatePhotoPreviews();
        };

        container.appendChild(img);
        container.appendChild(delBtn);
        photoPreviewGrid.appendChild(container);
      });
    }

    // Galaxy Theme Selector Buttons
    document.querySelectorAll('#theme-selectors .theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#theme-selectors .theme-btn').forEach(b => b.classList.replace('border-amber-400/80', 'border-transparent'));
        btn.classList.replace('border-transparent', 'border-amber-400/80');
        CURRENT_CONFIG.theme = btn.getAttribute('data-theme');
      });
    });

    // Apply Changes Button
    document.getElementById('apply-custom-btn').addEventListener('click', () => {
      // Apply Title
      const titleText = inputTitle.value.trim() || DEFAULT_CONFIG.titulo;
      CURRENT_CONFIG.titulo = titleText;
      document.getElementById('main-title').innerText = titleText;

      // Apply Phrases
      const lines = inputPhrases.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      CURRENT_CONFIG.frases = lines.length > 0 ? lines : DEFAULT_CONFIG.frases;

      // Rebuild Accretion Ring & Glow Theme
      ringMat.map = makeRingTexture(CURRENT_CONFIG.theme);
      ringMat.needsUpdate = true;

      glow.material.map = makeGlowTexture(CURRENT_CONFIG.theme);
      glow.material.needsUpdate = true;

      // Rebuild 3D Floating Elements
      rebuildTextGroup();
      rebuildPhotoGroup();
      triggerFlowerBurst();

      closeCustomizerDrawer();
    });

    // Reset Default Config Button
    document.getElementById('reset-custom-btn').addEventListener('click', () => {
      CURRENT_CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
      
      document.getElementById('main-title').innerText = CURRENT_CONFIG.titulo;
      inputTitle.value = CURRENT_CONFIG.titulo;
      inputPhrases.value = CURRENT_CONFIG.frases.join('\n');
      
      ringMat.map = makeRingTexture('gold');
      ringMat.needsUpdate = true;

      glow.material.map = makeGlowTexture('gold');
      glow.material.needsUpdate = true;

      rebuildTextGroup();
      rebuildPhotoGroup();
      updatePhotoPreviews();
      triggerFlowerBurst();

      closeCustomizerDrawer();
    });

    // Initial setup on window load
    window.onload = function() {
      rebuildTextGroup();
      rebuildPhotoGroup();
      animate();
    };
  </script>
</body>
</html>
